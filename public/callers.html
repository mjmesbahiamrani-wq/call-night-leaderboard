<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0f0c16">
<title>Race to the conversions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Podium de gala : un seul monde visuel, sombre, assume. Toutes les couleurs
   sont posees explicitement pour que la page tienne sur n'importe quel fond. */
:root{
  --fond:#0f0c16; --fond-haut:#1a1526; --carte:#1b1626; --carte-2:#241d35;
  --trait:#2a2338; --texte:#f2eef8; --doux:#9186a6;
  --or:#ffd75e; --argent:#d6dbe4; --bronze:#d08a4e;
  /* Les trois metaux, en version claire et foncee, pour les degrades. */
  --or-clair:#ffe9a3;    --or-fonce:#8a6a12;    --or-encre:#3a2c00;
  --argent-clair:#f2f5fa; --argent-fonce:#6e7681; --argent-encre:#20252c;
  --bronze-clair:#f0b183; --bronze-fonce:#7c4a1e; --bronze-encre:#2e1a0a;
  /* Team colours, in the order the teams are listed in TEAMS. */
  --t1:#ff6b7c; --t2:#6fa8ff; --t3:#ffd75e; --vert:#4fd39b; --rouge:#ff5f6d;
  --display:"Anton","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
/* Sans ca, toute regle d'auteur qui pose `display` annule l'attribut hidden :
   la couche reste affichee, invisible mais par-dessus tout, et avale les
   clics. C'est exactement ce qui est arrive au bilan. */
[hidden]{display:none!important}
/* Le degrade de base vit sur <html> : le corps doit rester transparent, sinon
   il repeindrait par-dessus les halos (un enfant en z-index negatif passe
   sous le fond de son parent). */
html{background:linear-gradient(180deg,var(--fond-haut),var(--fond) 60%) fixed no-repeat,var(--fond)}
body{margin:0;color:var(--texte);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased;
  background:transparent;min-height:100vh}

/* Trois halos derriere le contenu. Chacun suit une boucle fermee (la derniere
   image est identique a la premiere) parcourue a vitesse constante : le fond
   ne s'arrete jamais. Un aller-retour en ease-in-out, lui, ralentit aux deux
   bouts — et c'est exactement la que l'oeil croit que rien ne bouge. */
.ciel{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.ciel i{position:absolute;display:block;border-radius:50%;will-change:transform}
.ciel i:nth-child(1){width:84vmax;height:84vmax;left:-28vmax;top:-34vmax;
  background:radial-gradient(closest-side,rgba(126,74,196,.30),rgba(126,74,196,0) 72%);
  animation:derive1 34s linear infinite}
.ciel i:nth-child(2){width:72vmax;height:72vmax;right:-26vmax;top:12vmax;
  background:radial-gradient(closest-side,rgba(255,215,94,.13),rgba(255,215,94,0) 72%);
  animation:derive2 47s linear infinite}
.ciel i:nth-child(3){width:58vmax;height:58vmax;left:20vmax;bottom:-30vmax;
  background:radial-gradient(closest-side,rgba(255,107,124,.11),rgba(255,107,124,0) 72%);
  animation:derive3 61s linear infinite}
@media (prefers-reduced-motion:reduce){.ciel i{animation:none}}
@keyframes derive1{
  0%{transform:translate3d(0,0,0) scale(1)}
  25%{transform:translate3d(9vmax,6vmax,0) scale(1.09)}
  50%{transform:translate3d(14vmax,13vmax,0) scale(1.02)}
  75%{transform:translate3d(5vmax,8vmax,0) scale(.95)}
  100%{transform:translate3d(0,0,0) scale(1)}
}
@keyframes derive2{
  0%{transform:translate3d(0,0,0) scale(1.04)}
  25%{transform:translate3d(-8vmax,7vmax,0) scale(.96)}
  50%{transform:translate3d(-13vmax,-6vmax,0) scale(1.08)}
  75%{transform:translate3d(-4vmax,-11vmax,0) scale(1)}
  100%{transform:translate3d(0,0,0) scale(1.04)}
}
@keyframes derive3{
  0%{transform:translate3d(0,0,0) scale(1)}
  33%{transform:translate3d(11vmax,-7vmax,0) scale(1.12)}
  66%{transform:translate3d(-7vmax,-12vmax,0) scale(.94)}
  100%{transform:translate3d(0,0,0) scale(1)}
}
.page{max-width:1120px;margin:0 auto;padding-block:24px 56px;
  padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.kick{font:500 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--or)}
h1{font:400 clamp(34px,7.5vw,58px)/.92 var(--display);margin:10px 0 0;text-transform:uppercase;letter-spacing:.01em}
.live{display:flex;align-items:center;gap:9px;font:400 12px/1.4 var(--mono);color:var(--doux)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--vert);flex:0 0 auto}
.dot.off{background:var(--doux)} .dot.bad{background:var(--rouge)}
@media (prefers-reduced-motion:no-preference){.dot:not(.off):not(.bad){animation:pulse 2.4s ease-in-out infinite}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.controles{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0 0}
.bar{display:flex;gap:8px;flex-wrap:wrap}
#metriqueSel{font:500 13px/1 var(--body);color:var(--texte);background:var(--carte);
  border:1px solid var(--trait);border-radius:999px;padding:9px 14px;cursor:pointer;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--doux) 50%),linear-gradient(135deg,var(--doux) 50%,transparent 50%);
  background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat;
  padding-right:34px}
#metriqueSel:focus-visible{outline:2px solid var(--or);outline-offset:2px}
body:not(.tv) .ticker{display:none}
#details{margin-top:26px}
#details > summary{color:var(--doux);font:500 13px/1.3 var(--body)}
#details[open] > summary{margin-bottom:14px}
#details .equipes{margin:0}
#details .records{margin-top:14px}
#rapportBox{margin-top:12px}
.rapport{margin-top:12px;overflow-x:auto}
.rapport table{width:100%;border-collapse:collapse;font-size:13px;min-width:720px}
.rapport th,.rapport td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.08);text-align:right;white-space:nowrap}
.rapport th:first-child,.rapport td:first-child{text-align:left}
.rapport th{font-weight:600;opacity:.7;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
.rapport tr.tot td{font-weight:700;border-top:1px solid rgba(255,255,255,.25)}
.rapport .sous{opacity:.6;font-size:12px}
.rapport .jl{margin-top:16px}
.rapport .jl summary{cursor:pointer;opacity:.8;font-size:13px;margin:6px 0}
.rapport .exp{float:right;font-size:12px;opacity:.75;cursor:pointer;background:none;border:1px solid rgba(255,255,255,.25);color:inherit;border-radius:999px;padding:3px 10px}
body.tv #details,body.tv .controles{display:none}
a.chip{text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.chip{border:1px solid var(--trait);background:transparent;color:var(--doux);cursor:pointer;
  font:500 13px/1 var(--body);padding:9px 14px;border-radius:999px}
.chip[aria-pressed="true"]{background:var(--texte);color:var(--fond);border-color:var(--texte)}
.chip:focus-visible{outline:2px solid var(--or);outline-offset:2px}
#tv{color:var(--or);border-color:#4a3f1e}
#lang{font-weight:600;letter-spacing:.06em}
body.tv #lang{display:none}

.equipes{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:22px 0 0}
.eq{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:12px 14px;
  border-left:3px solid var(--doux)}
.eq.t1{border-left-color:var(--t1)} .eq.t2{border-left-color:var(--t2)} .eq.t3{border-left-color:var(--t3)}
.eq .t{font:500 11px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--doux)}
.eq .v{font:400 30px/1 var(--display);margin-top:7px;font-variant-numeric:tabular-nums}
.eq .s{font:400 11.5px/1.4 var(--mono);color:var(--doux);margin-top:4px}

/* ---------- le podium ---------- */
.podium{display:grid;grid-template-columns:1fr 1.22fr 1fr;gap:12px;align-items:end;margin:22px 0 0}
/* Grand ecran : le podium respire, et le classement passe sur deux colonnes
   pour occuper la largeur au lieu de laisser deux bandes noires sur les cotes. */
@media (min-width:1080px){
  .podium{gap:20px}
  .face{width:74px;height:74px;font-size:25px}
  .pod.r1 .face{width:100px;height:100px;font-size:34px}
  .pod .nm{font-size:17px}
  .pod .marche{font-size:clamp(38px,4vw,58px)}
  /* Un classement se lit en descendant : une seule colonne. */
  .rangs .rang{padding:15px 20px}
  .rangs .rang .n{font-size:22px}
  .rangs .rang .nm{font-size:16px}
  .rangs .rang .v{font-size:30px}
}
.pod{text-align:center;min-width:0}
.face{width:56px;height:56px;border-radius:50%;margin:0 auto 9px;display:grid;place-items:center;
  font:700 19px/1 var(--body);background:var(--carte-2);border:2px solid var(--trait);color:var(--doux)}
.pod.r1 .face{width:76px;height:76px;font-size:26px;border-color:var(--or);color:var(--or);
  box-shadow:0 0 0 6px rgba(255,215,94,.10),0 0 34px rgba(255,215,94,.28)}
.pod.r2 .face{border-color:var(--argent);color:var(--argent)}
.pod.r3 .face{border-color:var(--bronze);color:var(--bronze)}
.pod .rang-pastille{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;
  font:400 15px/1 var(--display);margin-bottom:7px;border:1px solid rgba(0,0,0,.25)}
.pod.r1 .rang-pastille{background:linear-gradient(160deg,var(--or-clair),var(--or-fonce));color:var(--or-encre);
  box-shadow:0 0 18px rgba(255,215,94,.3)}
.pod.r2 .rang-pastille{background:linear-gradient(160deg,var(--argent-clair),var(--argent-fonce));color:var(--argent-encre)}
.pod.r3 .rang-pastille{background:linear-gradient(160deg,var(--bronze-clair),var(--bronze-fonce));color:var(--bronze-encre)}
body.tv .pod .rang-pastille{width:40px;height:40px;font-size:23px;margin-bottom:10px}
.pod .nm{font:600 14px/1.25 var(--body);overflow-wrap:anywhere}
.pod .sub{font:500 10.5px/1.4 var(--mono);color:var(--doux);margin-top:4px}
.pod .marche{margin-top:11px;border-radius:10px 10px 0 0;display:grid;place-items:center;
  background:linear-gradient(180deg,var(--carte-2),#1d1729);position:relative;overflow:hidden;
  font:400 clamp(30px,6vw,44px)/1 var(--display);font-variant-numeric:tabular-nums;
  transition:height .5s cubic-bezier(.2,.8,.2,1)}
/* Or, argent, bronze. Trois couches, et chacune baisse d'un cran en
   descendant le podium : le reflet fixe donne la forme du metal, un eclat
   traverse la marche a intervalle regulier, le halo respire autour. L'or
   brille vite et fort, le bronze se contente d'un souffle — c'est le rang
   lui-meme qu'on lit, sans avoir a lire le chiffre. */
.pod.r1 .marche{color:var(--or-encre);--eclat:.58;--respire:3.4s;
  background:linear-gradient(118deg,transparent 34%,rgba(255,255,255,.26) 50%,transparent 66%),
             linear-gradient(180deg,var(--or),var(--or-fonce));
  box-shadow:0 0 26px rgba(255,215,94,.26)}
.pod.r2 .marche{color:var(--argent-encre);--eclat:.44;--respire:4.6s;
  background:linear-gradient(118deg,transparent 34%,rgba(255,255,255,.22) 50%,transparent 66%),
             linear-gradient(180deg,var(--argent-clair),var(--argent-fonce));
  box-shadow:0 0 20px rgba(214,219,228,.16)}
.pod.r3 .marche{color:var(--bronze-encre);--eclat:.32;--respire:5.8s;
  background:linear-gradient(118deg,transparent 34%,rgba(255,255,255,.18) 50%,transparent 66%),
             linear-gradient(180deg,var(--bronze-clair),var(--bronze-fonce));
  box-shadow:0 0 20px rgba(208,138,78,.18)}
/* L'eclat : une bande claire, plus large que la marche, qui la traverse puis
   attend hors champ le reste du cycle. Reserve a l'or : quand les trois
   marches clignotaient, aucune ne voulait plus rien dire. L'argent et le
   bronze gardent leur metal et leur halo, sans le balayage. */
.pod.r1 .marche::after{
  content:'';position:absolute;top:-25%;bottom:-25%;left:0;width:58%;pointer-events:none;
  transform:translateX(-170%);
  background:linear-gradient(104deg,transparent 26%,rgba(255,255,255,var(--eclat,.4)) 50%,transparent 74%)}
@media (prefers-reduced-motion:no-preference){
  .pod.r1 .marche::after{animation:eclair 4.2s cubic-bezier(.45,0,.5,1) infinite}
  .pod.r1 .marche{animation:haloOr var(--respire) ease-in-out infinite}
  .pod.r2 .marche{animation:haloArgent var(--respire) ease-in-out infinite}
  .pod.r3 .marche{animation:haloBronze var(--respire) ease-in-out infinite}
  .pod.r1 .rang-pastille{animation:haloOr var(--respire,3.4s) ease-in-out infinite}
  .pod.r2 .rang-pastille{animation:haloArgent 4.6s ease-in-out infinite}
  .pod.r3 .rang-pastille{animation:haloBronze 5.8s ease-in-out infinite}
  .pod.r1 .face{animation:haloFace 3.4s ease-in-out infinite}
}
@keyframes eclair{0%{transform:translateX(-170%)}36%,100%{transform:translateX(330%)}}
@keyframes haloOr{0%,100%{box-shadow:0 0 22px rgba(255,215,94,.22)}
                  50%{box-shadow:0 0 46px rgba(255,215,94,.50)}}
@keyframes haloArgent{0%,100%{box-shadow:0 0 18px rgba(214,219,228,.13)}
                      50%{box-shadow:0 0 34px rgba(214,219,228,.30)}}
@keyframes haloBronze{0%,100%{box-shadow:0 0 18px rgba(208,138,78,.14)}
                      50%{box-shadow:0 0 30px rgba(208,138,78,.28)}}
@keyframes haloFace{0%,100%{box-shadow:0 0 0 6px rgba(255,215,94,.10),0 0 30px rgba(255,215,94,.24)}
                    50%{box-shadow:0 0 0 6px rgba(255,215,94,.16),0 0 46px rgba(255,215,94,.44)}}
.pod.r1{filter:drop-shadow(0 0 22px rgba(255,215,94,.16))}
.pod.r2{filter:drop-shadow(0 0 16px rgba(214,219,228,.10))}
.pod.r3{filter:drop-shadow(0 0 16px rgba(208,138,78,.12))}
.pod .unite{font:500 9.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--doux);
  margin-top:7px}

/* ---------- la liste sous le podium ---------- */
.rangs{margin:18px 0 0;background:var(--carte);border:1px solid var(--trait);border-radius:12px;overflow:hidden}
.rang{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;padding:11px 15px}
.rang+.rang{border-top:1px solid var(--trait)}
.rang .n{font:400 17px/1 var(--display);color:var(--doux);text-align:center;font-variant-numeric:tabular-nums}
.eq.t1{border-left-color:var(--t1)}
.rang .nm{font:600 14px/1.25 var(--body);overflow-wrap:anywhere}
.rang .sub{font:400 11px/1.5 var(--mono);color:var(--doux)}
.rang .v{font:400 24px/1 var(--display);font-variant-numeric:tabular-nums}
.rang.zero{opacity:.55}
/* Le pipeline se lit a la couleur du filet, pas a une etiquette repetee. */
.rang.tuyau{border-left:3px solid var(--doux)}
.rang.tuyau.t1{border-left-color:var(--t1)}
.rang.tuyau.t2{border-left-color:var(--t2)}
.rang.tuyau.t3{border-left-color:var(--t3)}
.autres{padding:10px 15px;border-top:1px solid var(--trait);text-align:center;
  font:500 11.5px/1 var(--mono);color:var(--doux)}
.pipe{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;
  font:600 10px/1.7 var(--mono);letter-spacing:.04em;vertical-align:1px;background:var(--carte-2);color:var(--doux)}
.pipe.t1{color:var(--t1)} .pipe.t2{color:var(--t2)} .pipe.t3{color:var(--t3)}
.mv{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;
  font:600 10.5px/1.7 var(--body);vertical-align:1px;white-space:nowrap}
.mv.up{background:rgba(79,211,155,.15);color:var(--vert)}
.mv.down{background:rgba(255,95,109,.14);color:var(--rouge)}
.mv.pb{background:rgba(255,215,94,.16);color:var(--or)}

/* ---------- le prix de la semaine ----------
   Une bande, pas une carte : elle appartient au podium juste au-dessus. Le
   montant est le seul autre chiffre en or de la page, et il est a droite,
   la ou l'oeil finit sa ligne. */
.prix{margin:16px 0 0;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:linear-gradient(90deg,rgba(255,215,94,.13),rgba(255,215,94,0) 58%),var(--carte);
  border:1px solid #4a3f1e;border-radius:12px;padding:13px 16px}
.prix:empty{display:none}
.prix .face{width:46px;height:46px;margin:0;flex:0 0 auto;font-size:16px}
.prix .txt{min-width:0}
.prix .t{font:500 10.5px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--or)}
.prix .qui{font:600 16px/1.3 var(--body);margin-top:5px;overflow-wrap:anywhere}
.prix .s{font:400 11.5px/1.5 var(--mono);color:var(--doux);margin-top:3px;overflow-wrap:anywhere}
.prix .montant{margin-left:auto;text-align:right;font:400 34px/1 var(--display);color:var(--or);
  font-variant-numeric:tabular-nums}
.prix .montant small{display:block;margin-top:6px;font:500 9.5px/1.3 var(--mono);color:var(--doux);
  letter-spacing:.09em;text-transform:uppercase}
body.tv .prix{padding:18px 22px;gap:18px}
body.tv .prix .face{width:66px;height:66px;font-size:24px}
body.tv .prix .qui{font-size:24px}
body.tv .prix .s,body.tv .prix .t{font-size:14px}
body.tv .prix .montant{font-size:54px}
body.tv .prix .montant small{font-size:12px}
@media (max-width:520px){
  .prix .montant{font-size:27px;margin-left:0}
  .prix .txt{flex:1 1 100%;order:3}
}

/* ---------- barre d'objectif ---------- */
.objectif{margin:20px 0 0;background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 16px}
.objectif .hd{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.objectif .t{font:500 11px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--doux)}
.objectif .v{font:400 26px/1 var(--display);font-variant-numeric:tabular-nums}
.objectif .v small{font:500 12px/1 var(--mono);color:var(--doux);margin-left:4px}
.objectif .track{height:10px;border-radius:6px;background:var(--carte-2);overflow:hidden;margin-top:11px}
.objectif .fill{height:100%;border-radius:6px;background:linear-gradient(90deg,#b8863a,var(--or));
  transition:width .6s cubic-bezier(.2,.8,.2,1)}
.objectif .fill.plein{background:linear-gradient(90deg,#2f8f63,var(--vert))}
.objectif .s{margin-top:8px;font:400 11.5px/1.4 var(--mono);color:var(--doux)}
body.tv .objectif{margin-top:18px;padding:18px 22px}
body.tv .objectif .v{font-size:40px}
body.tv .objectif .t,body.tv .objectif .s{font-size:15px}
body.tv .objectif .track{height:16px}

/* ---------- l'ecran titre ----------
   Pas un « splash » centre : une carte de titre de diffusion, sur du noir.
   Le texte est cale en bas a gauche, le mot dore court d'un bord a l'autre
   quitte a se faire rogner, et deux reglettes tiennent la page. Ce qui est
   centre et empile se ressemble toujours ; ce qui est ancre a un coin tient
   debout. Le noir est a lui : la page reprend ses couleurs apres le clic. */
.ecran{position:fixed;inset:0;z-index:80;cursor:pointer;overflow:hidden;
  display:grid;grid-template-rows:auto 1fr auto auto;gap:18px;
  padding:clamp(16px,3.2vw,38px) clamp(16px,3.2vw,38px) clamp(16px,2.6vw,30px);
  background:#08060e;
  transition:opacity 1s ease,transform 1s ease}
/* Une seule lueur, decentree, pour que le noir ne soit pas un aplat mort. */
.ecran::before{content:"";position:absolute;left:-18vw;bottom:-26vh;width:86vw;height:86vh;
  border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(255,215,94,.10),transparent 70%)}
.ecran.parti{opacity:0;transform:scale(1.04);pointer-events:none}
.ecran > *{position:relative}

.ecran .haut,.ecran .bas{display:flex;justify-content:space-between;align-items:center;
  gap:14px;flex-wrap:wrap}
/* Le sur-titre n'est pas une ligne grise de plus : c'est un pave d'or,
   encre noire dessus. */
.ecran .slab{background:linear-gradient(150deg,var(--or-clair),var(--or) 60%,#e0b63f);
  color:#2e2200;padding:7px 13px 6px;font:600 11.5px/1 var(--mono);
  letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
.ecran .date{font:500 11.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#6f6588}

.ecran .milieu{align-self:end;display:block;min-width:0}
.ecran .blanc{display:block;color:var(--texte);font:400 clamp(26px,6.4vw,74px)/.9 var(--display);
  text-transform:uppercase;letter-spacing:.005em}
/* Le mot dore occupe toute la largeur. S'il depasse de quelques pixels, tant
   mieux : un titre rogne par le bord se lit comme un choix. */
.ecran .or{position:relative;display:block;white-space:nowrap;margin-top:.04em;
  font:400 min(16.6vw,232px)/.84 var(--display);text-transform:uppercase;letter-spacing:-.012em;
  background-image:linear-gradient(180deg,#ffefc2 0%,#ffd75e 33%,#c9982f 66%,#8a6a12 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
/* La lumiere qui passe : une copie du meme mot, posee par-dessus, qui ne
   porte qu'une bande claire en mouvement. Le texte vient de data-text. */
.ecran .or::after{content:attr(data-text);position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(100deg,rgba(255,255,255,0) 35%,rgba(255,255,255,.95) 48%,rgba(255,255,255,0) 61%);
  background-size:250% 100%;background-position:250% 0;
  -webkit-background-clip:text;background-clip:text;color:transparent}
.ecran .or.brille::after{animation:balayage 2.4s cubic-bezier(.3,.1,.2,1) .9s 1 forwards}
@keyframes balayage{0%{background-position:250% 0}100%{background-position:-60% 0}}
/* La reglette : epaisse, pleine largeur. C'est elle qui donne l'assise. */
.ecran .regle{display:block;height:5px;margin:clamp(14px,2vw,22px) 0 0;
  background:linear-gradient(90deg,var(--or) 0%,var(--or) 62%,#3a2f18 62%,#3a2f18 100%)}
.ecran .s{display:block;margin-top:13px;font:500 13px/1.5 var(--mono);color:#8b81a4;
  letter-spacing:.02em;max-width:52ch}

.ecran .invite{font:600 12.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--or-clair);display:inline-flex;align-items:center;gap:9px}
/* Un bloc qui clignote comme un curseur, pas un texte qui respire :
   ca dit « a toi de jouer » sans faire de la decoration. */
.ecran .invite b{display:inline-block;width:11px;height:15px;background:var(--or)}
@media (prefers-reduced-motion:no-preference){
  .ecran .invite b{animation:battement 1.05s steps(1,end) infinite}
}
@keyframes battement{0%,49%{opacity:1}50%,100%{opacity:0}}
.ecran:focus-visible{outline:none}
/* L'onde part exactement du point touche, pas du centre. */
.onde{position:fixed;z-index:81;width:40px;height:40px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,231,168,.38) 0%,rgba(255,231,168,0) 70%);
  transform:translate(-50%,-50%) scale(0);transition:transform 1s ease,opacity 1s ease}
.onde.va{transform:translate(-50%,-50%) scale(40);opacity:0}
@media (max-width:620px){
  .ecran .date{display:none}
  .ecran .s{font-size:12px}
  .ecran .or{font-size:min(14.6vw,86px)}
  .ecran .bas{flex-direction:column;align-items:flex-start;gap:9px}
}
@media (prefers-reduced-motion:reduce){.ecran{display:none}}

/* Les rangs entrent en cascade apres l'intro. */
@media (prefers-reduced-motion:no-preference){
  .rang{animation:rangMonte .45s cubic-bezier(.2,.8,.2,1) backwards}
  .pod{animation:podMonte .55s cubic-bezier(.2,.8,.2,1) backwards}
}
@keyframes rangMonte{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes podMonte{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

/* ---------- bandeau defilant, facon cotation ---------- */
.ticker{position:sticky;top:0;z-index:30;overflow:hidden;background:#0a0810;
  border-bottom:1px solid var(--trait);height:38px;display:flex;align-items:center}
.ticker:empty,.ticker.vide{display:none}
.piste{display:flex;gap:0;white-space:nowrap;will-change:transform;
  animation:defile var(--duree,60s) linear infinite}
.ticker:hover .piste{animation-play-state:paused}
@keyframes defile{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.piste{animation:none}}
.tk{display:inline-flex;align-items:center;gap:7px;padding:0 18px;font:500 13px/1 var(--mono);
  color:var(--doux);border-right:1px solid #1d1830}
.tk b{color:var(--texte);font-weight:600;font-family:var(--body);font-size:13.5px}
.tk .n{color:var(--or);font:400 16px/1 var(--display);font-variant-numeric:tabular-nums}
.tk.neuf{color:var(--vert)}
.tk.neuf b{color:#eafff2}
.tk.neuf .d{color:var(--vert);font-weight:700}
.tk.tete .n{color:var(--or)}
body.tv .ticker{height:56px}
body.tv .tk{font-size:19px;padding:0 26px}
body.tv .tk b{font-size:20px}
body.tv .tk .n{font-size:24px}

/* ---------- duel des pipelines ---------- */
.duel{margin:0}
.duel .titre{font:400 18px/1 var(--display);text-transform:uppercase;color:var(--doux);margin-bottom:9px}
.corde{display:flex;height:34px;border-radius:9px;overflow:hidden;border:1px solid var(--trait)}
.corde .seg{display:grid;place-items:center;font:400 17px/1 var(--display);color:#15121c;min-width:0;
  transition:width .6s cubic-bezier(.2,.8,.2,1)}
.corde .seg.t1{background:linear-gradient(180deg,#ff9aa5,var(--t1))}
.corde .seg.t2{background:linear-gradient(180deg,#a9cbff,var(--t2))}
.corde .seg.t3{background:linear-gradient(180deg,var(--t3),#b8863a)}
.leg{display:flex;gap:16px;flex-wrap:wrap;margin-top:9px;font:400 12px/1.5 var(--mono);color:var(--doux)}
.lg{display:inline-flex;align-items:center;gap:6px}
.lg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.lg i.t1{background:var(--t1)} .lg i.t2{background:var(--t2)} .lg i.t3{background:var(--t3)}
.lg b{color:var(--texte)}
.lg .pct{opacity:.7}
body.tv .duel .titre{font-size:24px}
body.tv .corde{height:52px}
body.tv .corde .seg{font-size:26px}
body.tv .leg{font-size:17px}

/* ---------- avatars monogrammes : une couleur par personne ---------- */
.mono{width:100%;height:100%;display:grid;place-items:center;border-radius:50%;
  background:linear-gradient(160deg,hsl(var(--h) 62% 42%),hsl(var(--h) 55% 26%));
  color:#fff;font:700 1em/1 var(--body);letter-spacing:.02em}
.pod.r1 .mono{background:linear-gradient(160deg,var(--or-clair),var(--or-fonce));color:var(--or-encre)}
.pod.r2 .mono{background:linear-gradient(160deg,var(--argent-clair),var(--argent-fonce));color:var(--argent-encre)}
.pod.r3 .mono{background:linear-gradient(160deg,var(--bronze-clair),var(--bronze-fonce));color:var(--bronze-encre)}

/* ---------- mur des records ---------- */
.records{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0 0}
.rec{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:11px 13px;
  border-top:2px solid var(--or)}
.rec .t{font:500 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--doux)}
.rec .v{font:400 26px/1 var(--display);margin-top:6px;color:var(--or);font-variant-numeric:tabular-nums}
.rec .s{font:400 11px/1.4 var(--mono);color:var(--doux);margin-top:3px;overflow-wrap:anywhere}
body.tv .records{margin-top:12px}
body.tv .rec .v{font-size:36px}
body.tv .rec .t,body.tv .rec .s{font-size:14px}

/* ---------- la rangee d'infos de l'ecran d'accueil ----------
   Des bulles, pas des cartes : l'ecran titre doit rester un titre, ces
   informations l'accompagnent sans lui disputer la vedette. */
.ecran .infos{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;
  justify-self:center;max-width:min(760px,90vw)}
.ecran .infos:empty{display:none}
.bulle{display:inline-flex;align-items:baseline;gap:9px;background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:9px 17px;
  font:500 13.5px/1.35 var(--body);color:var(--texte)}
.bulle b{font:500 10px/1 var(--mono);letter-spacing:.11em;text-transform:uppercase;
  color:var(--doux);font-weight:500}
.bulle.or{border-color:#4a3f1e;background:rgba(255,215,94,.10)}
.bulle.or b{color:var(--or)}
@media (max-width:560px){.bulle{font-size:12.5px;padding:8px 13px}}

/* ---------- la revelation ----------
   Elle couvre la page une poignee de secondes quand de nouveaux chiffres
   entrent. Au-dessus du ticker (z-index 60 pour les confettis), en dessous
   de rien : c'est le moment le plus important de la soiree. */
.reveal{position:fixed;inset:0;z-index:62;display:grid;place-items:center;padding:20px;
  background:rgba(12,9,18,.82);opacity:0;transition:opacity .3s ease;pointer-events:none}
.reveal.va{opacity:1;pointer-events:auto}
@supports (backdrop-filter:blur(3px)){.reveal{backdrop-filter:blur(3px)}}
.reveal .carte{width:min(520px,94vw);background:var(--carte);border:1px solid #4a3f1e;
  border-radius:16px;padding:24px 26px;text-align:center;
  box-shadow:0 24px 70px rgba(0,0,0,.55);
  transform:translateY(14px) scale(.97);transition:transform .34s cubic-bezier(.2,.9,.28,1)}
.reveal.va .carte{transform:none}
.reveal .t{font:500 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--or)}
.reveal .n{font:400 clamp(52px,12vw,84px)/1 var(--display);color:var(--or);margin-top:8px;
  font-variant-numeric:tabular-nums;text-shadow:0 0 34px rgba(255,215,94,.34)}
.reveal .s{font:400 12px/1.5 var(--mono);color:var(--doux);margin-top:2px}
.reveal .qui{margin-top:18px;border-top:1px solid var(--trait);display:grid;gap:1px}
.reveal .l{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:baseline;
  padding:9px 2px;border-bottom:1px solid var(--trait);text-align:left}
.reveal .l .nm{font:600 15px/1.3 var(--body);overflow-wrap:anywhere}
.reveal .l .g{font:600 13px/1 var(--body);color:var(--vert);font-variant-numeric:tabular-nums}
.reveal .l .tt{font:400 19px/1 var(--display);color:var(--texte);min-width:38px;text-align:right;
  font-variant-numeric:tabular-nums}
body.tv .reveal .carte{width:min(760px,92vw);padding:34px 38px}
body.tv .reveal .n{font-size:clamp(78px,10vw,124px)}
body.tv .reveal .t,body.tv .reveal .s{font-size:16px}
body.tv .reveal .l .nm{font-size:23px}
body.tv .reveal .l .g{font-size:19px}
body.tv .reveal .l .tt{font-size:30px}
@media (prefers-reduced-motion:reduce){
  .reveal,.reveal .carte{transition:none}
  .reveal .carte{transform:none}
}

/* ---------- celebrations ---------- */
.toast{position:fixed;left:50%;bottom:42px;transform:translateX(-50%);z-index:61;max-width:92vw;
  background:var(--or);color:#2a2005;font:700 16px/1.35 var(--body);padding:14px 22px;border-radius:999px;
  box-shadow:0 10px 40px rgba(0,0,0,.45);text-align:center;animation:toastIn .3s cubic-bezier(.2,.8,.2,1)}
.toast.out{opacity:0;transition:opacity .5s ease}
@keyframes toastIn{from{transform:translate(-50%,16px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
body.tv .toast{font-size:26px;padding:20px 36px;bottom:60px}

details{margin-top:24px;background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 16px}
summary{cursor:pointer;font:600 14px/1.3 var(--body)}
details p{margin:8px 0 12px;font-size:13px;color:var(--doux)}
.ph input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.note{margin-top:20px;color:var(--doux);font-size:13.2px}
.note b{color:var(--texte);font-weight:600}
.err{margin-top:20px;background:rgba(255,95,109,.1);border:1px solid var(--rouge);color:#ffb9bf;
  border-radius:12px;padding:20px;text-align:center}
.vide{padding:26px;text-align:center;color:var(--doux)}
footer:empty{display:none}
footer{margin-top:22px;padding-top:14px;border-top:1px solid var(--trait);font-size:12.2px;color:var(--doux)}

/* ---------- mode caller : plein ecran pour le Zoom ---------- */
.tvinfo{display:none;align-items:baseline;gap:14px;flex-wrap:wrap;margin:16px 0 0}
.tvinfo .quoi{font:400 clamp(22px,2.6vw,36px)/1 var(--display);text-transform:uppercase;color:var(--or)}
.tvinfo .quand{font:500 14px/1 var(--mono);color:var(--doux)}
.tvinfo .prochain{margin-left:auto;font:500 12px/1 var(--mono);color:var(--doux)}
body.tv .bar,body.tv .equipes,body.tv .note,body.tv footer{display:none}
body.tv .tvinfo{display:flex}
body.tv .page{max-width:1700px;padding-block:20px}
body.tv h1{font-size:clamp(40px,4.6vw,76px)}
body.tv .podium{gap:20px;margin-top:22px}
body.tv .face{width:92px;height:92px;font-size:32px}
body.tv .pod.r1 .face{width:126px;height:126px;font-size:44px}
body.tv .pod .nm{font-size:26px}
body.tv .pod .sub{font-size:14px}
body.tv .pod .marche{font-size:clamp(48px,6.4vw,96px);border-radius:14px 14px 0 0}
body.tv .pod .unite{font-size:13px}
body.tv .rang{grid-template-columns:52px 1fr auto;padding:16px 22px}
body.tv .rang .n{font-size:30px}
body.tv .rang .nm{font-size:24px}
body.tv .rang .sub{font-size:14px}
body.tv .rang .v{font-size:42px}
body.tv .pipe,body.tv .mv{font-size:14px;padding:2px 10px}
@media (max-width:600px){
  .podium{grid-template-columns:1fr;align-items:stretch;gap:10px}
  .pod.r1{order:-1}
  .pod .marche{height:auto!important;padding:14px 0}
}

/* Une ligne qui vient de doubler quelqu'un : un liseré d'or, une seconde.
   C'est le seul moment ou la page dit « regarde ici ». */
.rang.gagne,.pod.gagne{position:relative}
.rang.gagne::after,.pod.gagne::after{content:"";position:absolute;inset:0;pointer-events:none;
  border-radius:inherit;background:linear-gradient(90deg,rgba(255,215,94,.20),rgba(255,215,94,0) 62%);
  animation:eclatGagne 1.1s ease forwards}
@keyframes eclatGagne{from{opacity:1}to{opacity:0}}
@media (prefers-reduced-motion:reduce){.rang.gagne::after,.pod.gagne::after{display:none}}

/* ---------------------------------------------------------------------------
   Centrage, ecrit en dernier pour passer devant les marges des regles de base
   (un `margin: 20px 0 0` plus bas remettait les blocs a gauche).
--------------------------------------------------------------------------- */
.podium,.rangs,.prix,.objectif,#details,footer,.controles,.tvinfo{
  margin-left:auto;margin-right:auto;width:100%}
body.tv .page{max-width:1700px}
</style>
